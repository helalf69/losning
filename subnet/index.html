<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnet mask calculator</title>
    <style>
        body {
            background-color: navy;
            color: navajowhite;
            font-family: monospace;
        }
        div, h1, table {
            background-color: navajowhite;
            color: navy;
            padding: 7px;
            border-radius: 5px;
            width: 80%;
            margin: 5px auto;
            text-align: center;
        }
        input {
            border: 0px;
            background-color: navajowhite;
        }
        input[type=number] {
            background-color: white;
            border: 1px solid navy;
        }
        td {
            border: 1px solid orangered;
            padding: 4px;
            border-radius: 3px;
            background-color: navajowhite;
            width: auto;
        }
        .fourbyte {
            display: flex;
            justify-content: space-evenly;
            padding: 0px;
            border: 0px;
            margin: 2px 0px;
            width: 100%;
        }
    </style>
    <script>
        function toBin(dec) {
            const byte = document.querySelector("#"+dec).value;
            console.log(byte);
            let bin = (byte >>> 0).toString(2);
            while (bin.length < 8) {
                bin = "0" + bin;
            }
            console.log(bin);
            let binbyte = document.querySelector("#bin"+dec);
            binbyte.innerHTML = bin;
            const hosts = document.querySelector("#hosts");
            let check = 0;
            for(let i = 0; i <= 4; i++) {
                if (document.querySelector("#binnid"+i).value.isInteger()) { check++; }
            }
            console.log(check);
            if (check == 4) { 
                hosts.readOnly = false;
                hosts.style.backgroundColor = "white";

            }
        }
        function calcSM() {
            const hosts = document.querySelector("#hosts").value;
            console.log(hosts);
        }
    </script>
</head>
<body>
    <h1>Subnet Mask Calculator</h1>
    <div>Give me a valid network-ID and how many hosts you need, and I will calculate the rest.</div>
    <table>
        <tr>
            <td style="text-align: right;">
                Network ID:<br />
                Binary:
            </td>
            <td>
                <input type="number" min="0" max="255" size="8" id="nid0" onchange="toBin('nid0')"><br />
                <span id="binnid0">&nbsp;</span>
            </td>
            <td>
                <input type="number" min="0" max="255" size="8" id="nid1" onchange="toBin('nid1')"><br />
                <span id="binnid1">&nbsp;</span>
            </td>
            <td>
                <input type="number" min="0" max="255" size="8" id="nid2" onchange="toBin('nid2')"><br />
                <span id="binnid2">&nbsp;</span>
            </td>
            <td>
                <input type="number" min="0" max="255" size="8" id="nid3" onchange="toBin('nid3')"><br />   
                <span id="binnid3">&nbsp;</span>
            </td>
        </tr>
        <tr>
            <td style="text-align: right;" colspan="2">
                Number of hosts:
            </td>
            <td>
                <input type="number" min="0" max="255" size="8" id="hosts" style="background-color: grey;" onchange="calcSM()" readonly>
            </td>
            <td style="text-align: right;" colspan="2">
                (enter network-ID first)
            </td>
        </tr>
    </table>
</body>
</html>
